<title>Spell Duel Study Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centered card at a time, deck filter chips above, score strip below */
:root{
  --bg:#f3f1f8; --card:#ffffff; --fg:#1d1a2b; --muted:#6a6582; --line:#dcd7ea;
  --accent:#6b3fd4; --good:#1f8a4c; --bad:#c2372f; --chip:#ebe6f7;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121c; --card:#1e1b2a; --fg:#ece9f6; --muted:#a19bbb; --line:#332e45;
  --accent:#a888ff; --good:#4fcf86; --bad:#ff7a70; --chip:#2a2540; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121c; --card:#1e1b2a; --fg:#ece9f6; --muted:#a19bbb; --line:#332e45;
  --accent:#a888ff; --good:#4fcf86; --bad:#ff7a70; --chip:#2a2540; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,34px);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.q{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.3;margin:0;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.ans{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.ans p{margin:0}
.knob{font-family:var(--mono);font-size:13px;background:var(--chip);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre-wrap}
.knob b{color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--card);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.score{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.mode{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.reveal{align-self:flex-start}
</style>

<div class="wrap">
  <header>
    <h1>Spell Duel Study Cards</h1>
    <p class="sub">How the duel and the AI actually work, with the code knob behind each answer.</p>
  </header>

  <div class="chips" id="decks" role="group" aria-label="Decks"></div>

  <div class="row">
    <div class="mode">
      <button class="chip" id="modeQuiz" aria-pressed="true">Quiz</button>
      <button class="chip" id="modeFlash" aria-pressed="false">Flashcards</button>
      <button class="chip" id="missedOnly" aria-pressed="false">Missed only</button>
    </div>
    <span class="score" id="score"></span>
  </div>

  <article class="card" id="card" aria-live="polite"></article>

  <div class="row">
    <button class="btn ghost" id="prev">Back</button>
    <button class="btn ghost" id="shuffle">Shuffle</button>
    <button class="btn" id="next">Next</button>
  </div>
</div>

<script>
// [deck, question, choices, correct index, explanation, knob]
const C = [
// ---- Casting flow
["Casting","What are the three steps of a normal cast, in order?",["Draw, sign, push","Sign a letter, draw a shape, push","Sign, push, draw","Push, sign, draw"],1,"Signing charges an element, the drawing readies a spell, the push throws it.","combat.ts: sign() → drew() → push()"],
["Casting","You're charged and haven't started drawing. How long until the charge fades?",["1 s","2 s","3 s","It never fades"],2,"Any drawing activity resets the idle clock. Switching elements is instant.","CHARGE_LIFE_MS = 3000  (combat.ts)"],
["Casting","A spell is readied but you don't push. What happens?",["It throws itself after 3 s","It fades after 3 s and you fizzle","It stays forever","It fades and you're silenced"],1,"A faded ready spell counts as a fizzle: no throws for a moment, charge kept.","READY_LIFE_MS = 3000  (combat.ts)"],
["Casting","How long does a fizzle block throws?",["0.25 s","0.5 s","1 s","2 s"],1,"Your charge survives the fizzle and its idle clock restarts.","FIZZLE_LOCK_MS = 500  (combat.ts)"],
["Casting","Which of these causes a fizzle?",["Drawing a shape your element can't use","Signing a new element","Pushing with nothing charged","Being hit"],0,"Also: drawing with no element charged, a drawing finished under 100 ms, or a ready spell fading. Pushing with nothing does nothing.","drew() in combat.ts"],
["Casting","A spell is readied and you start drawing again. What happens?",["Nothing until you finish","The readied spell is dropped (Redraw)","You fizzle","It throws the readied spell"],1,"Lets you change your mind mid-cast without a penalty lock.","drawing() in combat.ts"],
["Casting","Can you switch elements while a spell is readied?",["Yes, instantly","No, signing is ignored while ready","Yes, but you fizzle","Only to Heal"],1,"Redraw or throw first. With no ready spell, switching is instant.","sign(): returns false if this.ready[side]"],
["Casting","What's the anti-cheat minimum for a drawing?",["The stroke must have been arriving for 100 ms","300 ms","At least 20 points","None"],0,"Stops a lag switch sending charge + drawing + push in one burst.","MIN_DRAW_MS = 100  (combat.ts)"],
["Casting","Pushing while charged with no drawing does what?",["Nothing","A quick Interrupt with that element (if it's in the counter cycle)","Throws a light attack","Fizzles"],1,"Heal has no interrupt, so pushing on H with nothing readied does nothing.","push(): c.el in BEATS → QUICK"],
["Casting","What does throwing do to your charge?",["Keeps it for the next spell","Uses it up","Keeps it 1 s","Converts it to Heal"],1,"Every throw starts you back at signing.","cast(): this.charge[caster] = null"],
// ---- Flight
["Timing","Flight times, fastest to slowest?",["Interrupt 160, counter 240, light 320, heavy 480, signature 650 ms","All 400 ms","Light 160, heavy 320, signature 480","Signature fastest"],0,"Counters fly faster because they're already hard to land. Damage applies on landing.","FLY_MS + flyMs()  (combat.ts)"],
["Timing","How fast does a Heal take effect?",["Instantly","320 ms","480 ms","650 ms"],0,"Heals don't fly, they land on the caster immediately.","cast(): landAt = el === 'H' ? now : now + fly"],
["Timing","You throw a signature, then the enemy throws a light attack 200 ms later. Which lands first?",["Yours, it was first","Theirs: 200 + 320 < 650","Same time","Depends on element"],1,"Spells land in arrival order, so a fast punch can beat a slow signature thrown earlier.","update(): flying sorted by landAt"],
["Timing","How often do damage-over-time and regen ticks fire?",["Every 250 ms","Every 500 ms","Every 1 s","Every frame"],1,"Burn and the hourglass both use the same tick.","TICK_MS = 500  (combat.ts)"],
["Timing","Starting HP for each fighter?",["100","120","150","200"],2,"The training dummy has infinite HP.","MAX_HP = 150  (combat.ts)"],
// ---- Elements
["Elements","Which letter is which element?",["F Fire, I Ice, W Water, E Earth, L Lightning, H Heal","F Fire, I Ice, W Wind, E Earth, L Light, H Heal","F Frost, I Iron, W Water, E Earth, L Lava, H Heal","Only five letters"],0,"Five attack elements plus Heal, which sits outside the counter cycle.","ELEMENTS  (spells.ts)"],
["Elements","Every attack element shares which two drawings?",["Line (light) and W (heavy)","Circle and line","Star and hourglass","Zigzag and spiral"],0,"Plus one signature per element. Heal uses star and hourglass instead.","PUNCHES = ['line','w']  (spells.ts)"],
["Elements","Light / heavy damage for Earth?",["10 / 30","7 / 22","6 / 18","5 / 15"],0,"Earth's identity is just raw damage, no on-hit effect.","PUNCH.E  (combat.ts)"],
["Elements","Light / heavy damage for Fire, before burn?",["10 / 30","7 / 22","6 / 18","5 / 15"],1,"Burn adds 4 (light) or 11 (heavy) over the next 1.5 s.","PUNCH.F, BURN = [4, 11]"],
["Elements","How does Fire's burn tick?",["All at once","Split over 3 ticks, starting one tick (0.5 s) after landing","Over 5 s","Only if they're chilled"],1,"Light: 2+1+1. Heavy: 4+4+3. Fire has the most total damage of the punches.","burn() + BURN  (combat.ts)"],
["Elements","Water's light / heavy damage and on-hit effect?",["6 / 18, heals you half of the damage dealt","5 / 15, heals 10","7 / 22, shield","6 / 18, slows"],0,"Mend uses damage actually dealt, rounded down, so chill bonus counts toward it.","PUNCH.W, land(): floor(dealt/2)"],
["Elements","What does Ice's chill do?",["Silences them","Their next direct hit taken within 4 s does +6 (light) or +15 (heavy)","Slows their drawing","Freezes their HP"],1,"Used up by the next direct hit. Burn and regen ticks don't consume it.","CHILL = [6, 15], CHILL_MS = 4000"],
["Elements","What does Lightning's static do?",["Extra damage","Their throws fizzle during 0.5 s pulses (with 0.5 s gaps)","Silences 2 s","Drops their charge"],1,"Light = 1 pulse, heavy = 3. A static fizzle loses the spell but keeps the charge.","STATIC_PULSES = [1, 3], PUNCH_STATIC"],
["Elements","Ice and Lightning punches do how much base damage?",["5 / 15","6 / 18","7 / 22","10 / 30"],0,"They're the weakest hitters because their effects carry the value.","PUNCH.I, PUNCH.L"],
// ---- Signatures
["Signatures","Which drawing is each element's signature?",["F flame, I cage, L zigzag 7, E battlements, W spiral","F spiral, I cage, L zigzag, E flame, W wave","F star, I hourglass...","All use the circle"],0,"Signatures are harder drawings that take longer, so they're easier to counter.","SIGNATURE  (spells.ts)"],
["Signatures","Meteor (Fire) does what?",["30 hit + 15 burn over 2.5 s (45 total)","35 hit","22 hit + 20 heal","10 hit + 1 s silence"],0,"The biggest total damage in the game.","land(): case 'flame'"],
["Signatures","Frozen Prison (Ice) does what?",["10 hit + 1 s silence on any element","30 hit","Chill for 10 s","2 s silence"],0,"Shorter than a counterspell's silence because it doesn't need the right element.","PRISON_SILENCE_MS = 1000"],
["Signatures","Thunderbolt (Lightning) does what?",["18 hit + 5 static pulses (0.5 s on, 0.3 s off)","35 hit","1 s silence","Drops their charge"],0,"A tighter, longer rhythm than the punch static.","THUNDERBOLT_STATIC"],
["Signatures","Earthquake (Earth) does what?",["35 hit + knocks off their charge and ready spell","30 hit + burn","10 hit + silence","Heals you"],0,"They must re-sign. Not a silence, so they can sign again immediately.","land(): case 'battlements'"],
["Signatures","Tidal Wave (Water) does what?",["22 hit + heals you 20","18 hit + static","30 hit","Heals you 40"],0,"A flat 20 heal, not tied to damage dealt like the punch mend.","land(): case 'spiral'"],
// ---- Heal
["Heal","Star vs hourglass?",["Star +20 instantly, hourglass +6 × 5 ticks (30 over ~2 s)","Star +30, hourglass +20","Both +20","Star over time, hourglass instant"],0,"The hourglass heals more total but can be stopped by a counterspell while ticking.","land(): el === 'H'"],
["Heal","What stops a heal?",["A counterspell (circle) of any element","Only a Water counter","A quick interrupt","Nothing"],0,"It hits a Heal charge or a ticking regen and also cancels the remaining ticks. An interrupt can't stop it.","land(): healing = shape === COUNTER && ..."],
// ---- Counters
["Counters","The counter cycle?",["Water beats Fire, Fire beats Ice, Ice beats Earth, Earth beats Lightning, Lightning beats Water","Fire beats Water...","Earth beats everything","Each beats its opposite"],0,"A five-element loop. Heal is outside it.","BEATS  (spells.ts)"],
["Counters","When does a counter succeed?",["When thrown, if they're charged","When it lands, if they're still charged with the element yours beats","Always","Only against signatures"],1,"Checked on landing, however fresh their charge. Re-signing or throwing in time dodges it.","land(): beats(el, c.el)"],
["Counters","Counterspell vs quick interrupt?",["Circle: 2 s silence. Interrupt (charge + push): 0.5 s","Both 2 s","Circle 1 s, interrupt 1 s","Interrupt is stronger"],0,"The interrupt trades power for speed: no drawing, 160 ms flight.","COUNTER_SILENCE_MS, QUICK_SILENCE_MS"],
["Counters","What does a silence do to the target?",["Clears their charge and ready spell and blocks casting","Only blocks throwing","Halves damage","Nothing to the charge"],0,"Silence is the strongest state in the game, which is why it's short.","silence()  (combat.ts)"],
["Counters","A counter that misses costs what?",["Nothing extra, but your charge was spent on it","A 2 s self-silence","10 HP","A fizzle lock"],0,"Shows 'Counter missed'. The charge was used by the throw.","land(): bolt.kind = 'missed'"],
// ---- AI
["AI","How long after the match starts does the AI cast first?",["Immediately","3 s","5 s","When you charge"],1,"Gives you time to get set.","start(): nextEnemyAt = now + 3000"],
["AI","How is an AI cast timed?",["Charge 700 ms + draw (per shape) + ready 500 ms, all × its speed","One fixed 2 s","Random","Same as your real times"],0,"It casts like a player, slowed so you can read it. Its charge shows its element from the start.","CHARGE_MS, DRAW_MS, READY_MS  (battle.ts)"],
["AI","Easy AI, light attack: total cast time?",["1.0 s","1.8 s","2.4 s","3.0 s"],1,"700 charge + 600 line + 500 ready at speed 1.","DRAW_MS.line = 600"],
["AI","Which shapes take the AI longest to draw?",["Battlements 2.4 s, then flame/zigzag/spiral 2.2 s","Line","Circle","All equal"],0,"Longer shapes give you a bigger window to counter. W is 1.7 s, line 0.6 s, circle 0.7 s.","DRAW_MS  (battle.ts)"],
["AI","Speed and gap between casts per difficulty?",["Easy 1× / 5 s, Medium 0.8× / 3.8 s, Hard 0.7× / 3.2 s, Insane 0.58× / 2.6 s","All 1×","Easy 3 s ... Insane 1 s","Only gap changes"],0,"Gaps vary ±20%. Speed multiplies charge, draw and ready.","AI table  (battle.ts)"],
["AI","What does 'ramp' do?",["AI gets up to 10% faster as the fight goes (≈6% at 30 s); off on Easy","Doubles damage","Heals over time","Shortens your timers"],0,"Speeds both its casts and its gaps, then levels off.","speed(): 0.1 × (1 − e^(−t/30 s))"],
["AI","What does the AI attack with?",["Random element; line 40, W 30, signature 14 (weights)","Always signatures","Only Fire","Whatever counters you"],0,"About 48% light, 36% heavy, 17% signature. Same rules as you, so the shape tells you what's coming.","ENEMY_MOVES  (battle.ts)"],
["AI","When does the AI heal?",["Below its heal threshold (25/35/40/40%), max once per 6 s, 50% chance on Easy, 85% otherwise","Never","Every 10 s","When you heal"],0,"Star if it's under half the threshold, otherwise hourglass.","healBelow, nextSpell()"],
["AI","How does the AI react to your charge?",["Rolls once per new charge: counter chance 0 / 35 / 50 / 65%","Always counters","Never","Only on Insane"],0,"It only starts if you're still charged with that element when its reaction time is up.","react, react()  (battle.ts)"],
["AI","AI reaction times before it starts a counter?",["Medium 0.9–1.4 s, Hard 1.0–1.4 s, Insane 0.8–1.1 s","All 0.2 s","2 s","Instant"],0,"Then it holds the counter element 350 ms × speed (never under 150 ms) before throwing.","reactMs, COUNTER_HOLD_MS"],
["AI","What share of AI counters are full circles vs interrupts?",["Circle 30 / 40 / 50% (Medium/Hard/Insane), rest interrupts","All circles","All interrupts","50/50 always"],0,"Against your heal it always picks a circle (any element), unless it makes a mistake.","circle  (battle.ts)"],
["AI","How does the AI 'miss' a counter?",["20% (Medium/Hard) or 5% (Insane): picks a wrong element, or vs a heal uses an interrupt that can't stop it","It never misses","Throws late","Draws wrong"],0,"Built-in mistakes so its counters are beatable.","miss  (battle.ts)"],
["AI","Will the AI drop its own spell to counter you?",["No: once it's drawing, it finishes, then counters if you're still open","Yes, always","Only on Insane","Only for heals"],0,"While it's still in the charge phase it can switch to the counter.","react(): 'Committed'"],
["AI","What does 'capitalize' (Hard, Insane) do?",["Punishes your silence with the biggest spell that lands before you can react; throws signatures if you're silenced >1.2 s; lines if you're under 20% HP","Doubles damage","Heals more","Counters more"],0,"Punish fits its spell inside silence left + 300 ms, with only a 100 ms ready.","punish(), PUNISH_SLACK_MS = 300"],
["AI","What happens when your counter silences the AI?",["Its cast is cancelled and its next cast waits at least 2 s","It keeps casting","It heals","It forfeits"],0,"Landing counters is your main way to buy breathing room.","update(): isSilenced('enemy')"],
["AI","The training dummy?",["Infinite HP, shows damage dealt, never attacks","150 HP, attacks slowly","Only counters","Heals itself"],0,"Use it to test combos and damage numbers.","DummyArena  (battle.ts)"],
];

const decks=["All",...new Set(C.map(c=>c[0]))];
let deck="All", mode="quiz", missedOnly=false, order=[], pos=0, revealed=false, right=0, seen=0;
let missed=new Set();
try{missed=new Set(JSON.parse(localStorage.getItem("missed")||"[]"))}catch(e){}
const saveMissed=()=>{try{localStorage.setItem("missed",JSON.stringify([...missed]))}catch(e){}};
const $=id=>document.getElementById(id);

function build(shuffle){
  order=C.map((_,i)=>i).filter(i=>(deck==="All"||C[i][0]===deck)&&(!missedOnly||missed.has(i)));
  if(shuffle) for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  pos=0; right=0; seen=0; render();
}
function knob(k){return k.replace(/^([A-Za-z_.]+(?:\(\))?)/,"<b>$1</b>")}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){
  revealed=false;
  const card=$("card");
  $("score").textContent = mode==="quiz" ? `${right}/${seen} right` : `${missed.size} missed saved`;
  if(!order.length){card.innerHTML=`<p class="q">No cards here.</p><p class="sub">${missedOnly?"You haven't missed any in this deck yet.":""}</p>`;return}
  const [d,q,ch,ok,ex,k]=C[order[pos]];
  let h=`<div class="meta"><span>${d}</span><span>${pos+1} / ${order.length}</span></div><p class="q">${esc(q)}</p>`;
  if(mode==="quiz") h+=`<div class="opts">${ch.map((c,i)=>`<button class="opt" data-i="${i}">${esc(c)}</button>`).join("")}</div>`;
  else h+=`<button class="btn ghost reveal" id="flip">Show answer</button>`;
  h+=`<div class="ans" id="ans" hidden><p><strong>${esc(ch[ok])}</strong></p><p>${esc(ex)}</p><div class="knob">${knob(esc(k))}</div>${mode==="flash"?`<div class="row"><button class="btn ghost" id="gotIt">Knew it</button><button class="btn ghost" id="missIt">Didn't know</button></div>`:""}</div>`;
  card.innerHTML=h;
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const f=$("flip"); if(f) f.onclick=()=>{$("ans").hidden=false;f.hidden=true;
    $("gotIt").onclick=()=>{missed.delete(order[pos]);saveMissed();next()};
    $("missIt").onclick=()=>{missed.add(order[pos]);saveMissed();next()};};
}
function answer(i){
  if(revealed) return; revealed=true; seen++;
  const idx=order[pos], ok=C[idx][3];
  if(i===ok){right++;missed.delete(idx)} else missed.add(idx);
  saveMissed();
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const n=+b.dataset.i;if(n===ok)b.classList.add("right");else if(n===i)b.classList.add("wrong")});
  $("ans").hidden=false;
  $("score").textContent=`${right}/${seen} right`;
}
function next(){if(order.length){pos=(pos+1)%order.length;render()}}
$("next").onclick=next;
$("prev").onclick=()=>{if(order.length){pos=(pos-1+order.length)%order.length;render()}};
$("shuffle").onclick=()=>build(true);
const setPressed=(el,v)=>el.setAttribute("aria-pressed",v);
$("modeQuiz").onclick=()=>{mode="quiz";setPressed($("modeQuiz"),true);setPressed($("modeFlash"),false);render()};
$("modeFlash").onclick=()=>{mode="flash";setPressed($("modeFlash"),true);setPressed($("modeQuiz"),false);render()};
$("missedOnly").onclick=()=>{missedOnly=!missedOnly;setPressed($("missedOnly"),missedOnly);build(false)};
$("decks").innerHTML=decks.map(d=>`<button class="chip" data-d="${d}" aria-pressed="${d===deck}">${d} <span style="opacity:.7">${d==="All"?C.length:C.filter(c=>c[0]===d).length}</span></button>`).join("");
$("decks").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{deck=b.dataset.d;$("decks").querySelectorAll(".chip").forEach(x=>setPressed(x,x===b));build(false)});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")next();
  if(e.key==="ArrowLeft")$("prev").click();
  if(mode==="quiz"&&/^[1-4]$/.test(e.key))answer(+e.key-1);
  if(mode==="flash"&&e.key===" "){e.preventDefault();const f=$("flip");if(f&&!f.hidden)f.click()}
});
build(true);
</script>
