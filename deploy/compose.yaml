# Production on one small server (deploy/README.md): Caddy (HTTPS) -> the game -> Postgres.
# Lives on the server at ~/asl/compose.yaml next to .env and Caddyfile. The deploy workflow copies it there.
services:
  app:
    image: ${IMAGE:-ghcr.io/ak2691/asl-game}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://aslwizard:${POSTGRES_PASSWORD}@db:5432/aslwizard
      PORT: "8787"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" } # keeps logs from filling the disk

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aslwizard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aslwizard
    # Sized for a 1 GB server (Postgres's defaults assume more memory).
    command: postgres -c shared_buffers=128MB -c effective_cache_size=256MB -c work_mem=4MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data # the database lives here (on the server's disk); never `docker compose down -v`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aslwizard"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logs
    # No ports: only the app can reach it.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # HTTPS certificates (Let's Encrypt, renewed automatically)
      - caddy_config:/config
    depends_on:
      - app
    logging: *logs

volumes:
  pgdata:
  caddy_data:
  caddy_config:
